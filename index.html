<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>HUMUUN ILC AR</title>

<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>
body {
  margin: 0;
  overflow: hidden;
  font-family: Arial, sans-serif;
  background: black;
}

/* SCAN */
#scan {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  color: white;
  background: radial-gradient(circle, #0b1220, #000);
  z-index: 10;
}

#scan.hidden {
  opacity: 0;
  pointer-events: none;
}

/* OVERLAY */
#ui {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  padding: 16px;
  color: white;
  z-index: 20;
  pointer-events: none;
}

.card {
  background: rgba(20, 30, 50, 0.75);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 16px;
  padding: 14px;
  margin-top: 10px;
  backdrop-filter: blur(10px);
}

/* TITLE */
.title {
  font-size: 22px;
  font-weight: 800;
  margin-bottom: 4px;
}

.sub {
  font-size: 12px;
  opacity: 0.7;
}

/* BUTTONS */
.tabs {
  display: flex;
  gap: 8px;
  margin-top: 10px;
}

button {
  flex: 1;
  padding: 10px;
  border-radius: 12px;
  border: none;
  background: rgba(255,255,255,0.1);
  color: white;
}

button.active {
  background: #38bdf8;
  color: black;
}

/* MOBILE */
@media (max-width: 768px) {
  .title {
    font-size: 18px;
  }
  .card {
    padding: 12px;
  }
}
</style>
</head>

<body>

<!-- SCAN SCREEN -->
<div id="scan">
  <h1>HUMUUN ILC</h1>
  <p>Point camera to poster</p>
</div>

<!-- UI -->
<div id="ui">
  <div class="card">
    <div class="title">HUMUUN ILC</div>
    <div class="sub">Independent Living Center</div>

    <div class="tabs">
      <button class="active" onclick="tab('about')">About</button>
      <button onclick="tab('team')">Team</button>
      <button onclick="tab('contact')">Contact</button>
    </div>

    <div id="content" style="margin-top:10px;font-size:13px;line-height:1.5;">
      NGO supporting independent living for persons with disabilities in Mongolia.
    </div>
  </div>
</div>

<!-- AR SCENE -->
<a-scene
  mindar-image="imageTargetSrc: ./targets.mind; autoStart: true;"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false">

<a-camera position="0 0 0"></a-camera>

<a-entity mindar-image-target="targetIndex: 0" id="target">

  <a-text value="HUMUUN ILC"
          color="white"
          position="0 0.3 0"
          scale="0.8 0.8 0.8">
  </a-text>

  <a-plane color="#38bdf8"
           opacity="0.3"
           width="1"
           height="0.6"
           position="0 0 0">
  </a-plane>

</a-entity>

</a-scene>

<script>
const scan = document.getElementById("scan");
const target = document.getElementById("target");
const content = document.getElementById("content");

function tab(name){
  const data = {
    about: "NGO supporting independent living and disability rights in Mongolia.",
    team: "Small dedicated team working across Orkhon & Darkhan-Uul.",
    contact: "+976 9952 3330 | Facebook | Location available on map."
  };
  content.innerText = data[name];
}

target.addEventListener("targetFound", () => {
  scan.classList.add("hidden");
});

target.addEventListener("targetLost", () => {
  scan.classList.remove("hidden");
});
</script>

</body>
</html>
